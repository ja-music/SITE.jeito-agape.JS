{%- include wa-vars.html -%}{%- include faq-vars.html -%}
<!DOCTYPE html>
<html lang="pt-BR" class="no-js" data-ga4="{% if jekyll.environment == 'production' %}{{ site.ga4_id }}{% endif %}" data-ads-conversion="{% if jekyll.environment == 'production' %}{{ site.google_ads_conversion }}{% endif %}">
<head>
{% include head.html %}
</head>
<body data-page="{{ page.schema | default: 'page' }}">
<script>document.documentElement.classList.replace('no-js','js')</script>
<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<div id="topo-sentinela" aria-hidden="true"></div>
{% include header.html %}
<main id="conteudo">
{{ content }}
</main>
{% include footer.html %}
{% include whatsapp-float.html %}
<button id="voltar-topo" class="back-to-top" type="button" aria-label="Voltar ao topo">{% include icon.html name="arrow-up" %}</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>

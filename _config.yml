# Jekyll Configuration — Jeito Ágape
title: Jeito Ágape
tagline: "Ministério de Música Católica"
description: "Jeito Ágape é um ministério de música católica de Belo Horizonte - MG. Há 16 anos evangelizando através da música, com mais de 500 missões realizadas em missas, retiros, shows e EJCs."
url: "https://jeitoagape.com.br"
lang: pt-BR
locale: pt_BR
logo: /assets/logo.png
timezone: America/Sao_Paulo

# GA4 (propriedade da conta da banda). Só entra no build de produção (JEKYLL_ENV=production).
ga4_id: "G-HMWJ8YLG75"

# Google Ads — ação de conversão "Convite WhatsApp" (clique em qualquer botão do WhatsApp).
# Preencher DEPOIS de criar a conta + a ação de conversão no Google Ads.
# Formato: "AW-XXXXXXXXX/RÓTULO" (ID da conversão e rótulo, juntos por "/"). Vazio = desativado (no-op).
google_ads_conversion: "AW-18334068087/uxE2CImi3dIcEPfarqZE"

# Social / SEO
social:
  name: Jeito Ágape
  links:
    - https://www.instagram.com/jeitoagape
    - https://www.youtube.com/jeitoagape
    - https://www.tiktok.com/@jeitoagape
    - https://open.spotify.com/album/3m1HYXg7gYW2PWSacnrrkK

# Permalinks
permalink: /blog/:year/:month/:day/:title/

# Plugins (supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-last-modified-at   # lastmod do sitemap vem do git (precisa de fetch-depth: 0 no CI)

# Coleções: páginas de intenção (/banda-para-missa/ …) e páginas institucionais (/sobre/ …).
# Uma lista só (site.servicos) alimenta home, menu, rodapé, llms.txt e os links entre irmãs.
collections:
  servicos:
    output: true
    permalink: /:name/
    sort_by: order
  paginas:
    output: true
    permalink: /:name/

sass:
  style: compressed
  sass_dir: _sass

# Feed
feed:
  path: /blog/feed.xml

# Defaults — sem isto, um post que esquece "layout: post" no front matter é publicado
# como HTML cru: sem <head>, sem meta/OG, sem convite no fim, sem relacionados. Falha silenciosa.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      schema: article
  - scope:
      path: ""
      type: servicos
    values:
      layout: service
      schema: service
  - scope:
      path: ""
      type: paginas
    values:
      layout: page
      schema: page

# Exclude from build — tudo que é ferramenta/contexto de design ou pipeline, não site.
exclude:
  - README.md
  - CLAUDE.md
  - LICENSE
  - PRODUCT.md
  - DESIGN.md
  - design/
  - scripts/
  - package.json
  - package-lock.json
  - node_modules/
  - budget.json

# Perguntas frequentes de quem organiza o evento (pároco, coordenador de pastoral,
# comissão de festa). Este arquivo é a FONTE ÚNICA: alimenta a seção visível do site
# E o JSON-LD FAQPage (rich result do Google). Editar aqui atualiza os dois.
#
# Mantenha as respostas em texto puro (sem HTML) — elas vão para o JSON-LD.

# Redação proposital: fala do HISTÓRICO (fato) em vez de prometer gratuidade para sempre,
# e leva a conversa para o WhatsApp. Assim a política pode mudar sem desmentir o site.
- id: convite
  home: true
  pergunta: "Como funciona o convite?"
  resposta: >-
    Pelo WhatsApp. Conte o tipo de celebração, a cidade e a data; a gente verifica a agenda e
    alinha os detalhes antes de confirmar. Nossa história é de mais de 500 missões em mais de
    100 cidades sem cobrar cachê.

- id: quantas-pessoas
  home: true
  pergunta: "Quantas pessoas vêm?"
  resposta: >-
    O ministério completo tem 7 integrantes. A formação se ajusta ao espaço e ao tipo da
    celebração; combinamos isso na primeira conversa.

- id: som-estrutura
  home: true
  pergunta: "Precisamos providenciar som e estrutura?"
  resposta: >-
    Sim. A sonorização fica por conta da comunidade: um sistema de som com canais suficientes,
    retorno para quem canta e alguém que conheça a mesa. É o único ponto que pedimos para
    organizar com antecedência.

- id: duracao
  home: true
  pergunta: "Quanto tempo dura a apresentação?"
  resposta: >-
    Um show dura cerca de 1h10. Na Missa, a música acompanha o ritmo da celebração; em retiros
    e encontros, seguimos a programação da equipe.

- id: outras-cidades
  home: true
  pergunta: "Vocês vão para outras cidades e para o interior?"
  resposta: >-
    Sim. Já passamos por mais de 100 cidades de Minas e do Brasil. Conte a cidade e a data, que
    a gente verifica.

- id: antecedencia
  home: true
  pergunta: "Com quanta antecedência precisamos convidar?"
  resposta: >-
    Não há prazo fixo; depende da agenda. Quanto antes você falar com a gente, maior a chance de
    a data estar livre. Para datas fixas, como festa de padroeiro, EJC ou retiro, procure com
    alguns meses de antecedência.

- id: tipos-de-evento
  home: true
  pergunta: "Que tipos de celebração vocês atendem?"
  resposta: >-
    Missas, novenas e festas de padroeiro, retiros, EJC, shows de evangelização, grupos de
    oração, ministrações, pregações e eventos diocesanos e municipais.

